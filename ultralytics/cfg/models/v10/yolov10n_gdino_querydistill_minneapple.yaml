# YOLOv10-N with training-only Grounding DINO query-relation distillation
# on the isolated MinneApple grouped train split.
nc: 80
scales:
  n: [0.33, 0.25, 1024]
query_distill:
  cache_path: D:/Github Code/yolov10-improved/datasets/grounding_dino_coco/minneapple_grouped/query_cache_epoch14.pt
  teacher_dim: 256
  instance_weight: 0.25
  relation_weight: 0.10
  # Cache GT boxes are compact float16 tensors.  MinneApple's dense small
  # apples make that representation error material, so this label-identity
  # match must tolerate quantization while teacher reliability remains gated
  # upstream by teacher/GT IoU and confidence.
  match_iou: 0.95

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SCDown, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SCDown, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2fCIB, [1024, True, True]]
  - [[16, 19, 22], 1, v10Detect, [nc]]
